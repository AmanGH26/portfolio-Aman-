function renderTest(){let ix=order[current],q=questions[ix],selected=answers[ix],m=metrics();const optionOrder=window.optionOrders?.[ix]||shuffle(q.options.map((_,i)=>i));window.optionOrders=window.optionOrders||{};window.optionOrders[ix]=optionOrder;let chosenCorrect=selected!==undefined&&selected===q.answer;app.innerHTML=`<div class="top"><div class="brand"><div class="brandmark">🌿</div> Fieldnotes</div><span class="tag">ASSIGNMENTS 1–10</span></div><div class="hero"><div><div class="eyebrow">Wildlife Ecology · Practice</div><h1>Test your field knowledge</h1><p>Take it one question at a time. Your progress updates as you answer.</p></div><div class="subtle">Questions and answer choices are shuffled for each new attempt.</div></div><div class="layout"><main class="card question"><div class="qmeta"><span><strong>Question ${current+1}</strong> of ${order.length} · Assignment ${q.week}</span><span>${m.done} answered</span></div><div class="progress"><i style="width:${(current+1)/order.length*100}%"></i></div><h2 class="prompt">${escapeHtml(q.text)}</h2><div class="choices">${optionOrder.map((oi,k)=>`<button class="choice ${selected===oi?'selected ':''}${selected!==undefined&&oi===q.answer?'correct ':''}${selected===oi&&!chosenCorrect?'wrong':''}" onclick="answer(${ix},${oi})"><span class="letter">${'ABCD'[k]}</span><span>${escapeHtml(q.options[oi])}</span></button>`).join('')}</div>${selected!==undefined?`<div class="feedback ${chosenCorrect?'good':'bad'}"><b>${chosenCorrect?'Correct':'Not quite'}</b> · ${chosenCorrect?'Nice work.':'The correct answer is: '+escapeHtml(q.options[q.answer])}</div>`:''}<div class="nav"><button class="btn" onclick="move(-1)" ${current===0?'disabled':''}>← Previous</button><button class="btn primary" onclick="${current===order.length-1?'showResults()':'move(1)'}">${current===order.length-1?'Finish test':'Next question →'}</button></div></main><aside class="side"><section class="card stats"><h3>Live analysis</h3><div class="statgrid"><div class="stat"><b>${m.correct}</b><span>Correct</span></div><div class="stat"><b>${m.accuracy}%</b><span>Accuracy</span></div><div class="stat"><b>${m.done}</b><span>Answered</span></div><div class="stat"><b>${order.length-m.done}</b><span>Unanswered</span></div></div><div class="accuracy"><div class="accuracyline"><span>Accuracy</span><b>${m.accuracy}%</b></div><div class="bar"><i style="width:${m.accuracy}%"></i></div></div></section><section class="card navcard"><div class="navhead"><span>Question map</span><div class="legend"><span class="done">Answered</span><span class="current">Here</span></div></div><div class="grid">${order.map((j,k)=>`<button class="dot ${answers[j]!==undefined?'done ':''}${k===current?'active':''}" onclick="jump(${k})">${k+1}</button>`).join('')}</div></section><section class="card note">Your selections stay marked as you move between questions. You can change an answer before finishing.</section></aside></div>`}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function answer(ix,oi){answers[ix]=oi;renderTest()}
function move(d){current=Math.max(0,Math.min(order.length-1,current+d));renderTest()}
function jump(k){current=k;renderTest()}
function showResults(){let m=metrics(),unanswered=order.length-m.done;app.innerHTML=`<div class="top"><div class="brand"><div class="brandmark">🌿</div> Fieldnotes</div><span class="tag">PRACTICE COMPLETE</span></div><section class="card results"><div class="resulttop"><div class="eyebrow">Your results</div><div class="scorebig">${m.correct}<span style="font-size:24px;color:#819087"> / ${order.length}</span></div><h1>${m.accuracy>=80?'Strong fieldwork.':m.accuracy>=55?'Good progress.':'Keep exploring.'}</h1><p style="color:var(--muted)">${m.accuracy}% accuracy · ${m.done} answered · ${unanswered} unanswered</p></div><div class="results-actions"><button class="btn" onclick="start()">Try a new randomized test</button><button class="btn primary" onclick="renderWelcome()">Done</button></div><h2 style="font-size:18px">Answer review</h2><p style="color:var(--muted);font-size:13px">Questions appear in your test order. Correct options are shown for every question.</p>${order.map((ix,k)=>{let q=questions[ix],a=answers[ix];return`<article class="review"><h3>${k+1}. ${escapeHtml(q.text)}</h3>${a===undefined?`<p class="badtext">Not answered</p>`:`<p class="${a===q.answer?'goodtext':'badtext'}">Your answer: ${escapeHtml(q.options[a])} ${a===q.answer?'✓':'✗'}</p>`}<p class="goodtext">Correct answer: ${escapeHtml(q.options[q.answer])}</p><p>Assignment ${q.week}</p></article>`}).join('')}<div class="results-actions"><button class="btn primary" onclick="start()">Try a new randomized test</button></div><p style="font-size:11px;color:var(--muted)">Correct answers are inferred because the source PDFs do not visibly identify answer choices.</p></section>`}
renderWelcome();
</script></body></html>
